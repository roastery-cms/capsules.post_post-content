[test]
smol = true
root = "src"
preload = ["./test/replace-node-env.ts", "./test/set-max-listeners-to-zero.ts"]
serial = true
paths = ["./src"]
coveragePathIgnorePatterns = [
  # Test files
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/*.e2e.ts",

  # Configuration files
  "*.config.js",
  "*.config.ts",
  "webpack.config.*",
  "vite.config.*",

  # Build output
  "dist/**",
  "build/**",
  ".next/**",

  # Generated code
  "generated/**",
  "**/*.generated.ts",

  # Vendor/third-party
  "vendor/**",
  "third-party/**",

  # Dev bootstrap (test harness, not production code)
  "src/presentation/server/**",

  # Utilities that don't need testing
  "src/utils/constants.ts",
  "src/types/**",

  "**/dist/**/*.js",
  "src/infra/repositories/prisma/post-content.repository.ts",
  "src/infra/repositories/api/post.repository.ts",
  "src/infra/factories/repositories/post.repository.factory.ts"
]
coverageIgnoreSourcemaps = true
